name: Build apps

# Builds the Windows installer and the Mac apps. Runs when you push a tag like v2.2.0 (the files are
# attached to a GitHub release), or by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install -r packaging/requirements-app.txt pyinstaller
      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Get-ChildItem ffmpeg_dl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination packaging/ffmpeg
      - name: Build the app
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/whisper_transcriber.spec --noconfirm
      - name: Check it starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Whisper Transcriber/Whisper Transcriber.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The app's self-test failed (exit code $($p.ExitCode))" }
      - name: Make the installer
        shell: pwsh
        run: |
          $env:APP_VERSION = (python -c "import transcriber; print(transcriber.__version__)")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Whisper-Transcriber-Setup-*.exe

  mac:
    strategy:
      matrix:
        include:
          - runner: macos-14       # Apple Silicon (M1 and newer)
            arch: apple-silicon
          - runner: macos-13       # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install -r packaging/requirements-app.txt pyinstaller
      - name: Build the app
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/whisper_transcriber.spec --noconfirm
      - name: Check it starts
        run: '"dist/Whisper Transcriber.app/Contents/MacOS/Whisper Transcriber" --self-test'
      - name: Zip it
        run: |
          cd dist
          ditto -c -k --keepParent "Whisper Transcriber.app" "Whisper-Transcriber-Mac-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/Whisper-Transcriber-Mac-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
